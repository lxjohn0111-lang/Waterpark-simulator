<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Splash Haven: Waterpark Tycoon</title>
  <meta name="description" content="Build, run and ride your own waterpark in first person." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2316b5e8'/%3E%3Cpath d='M6 38c8-6 13 6 21 0s13 6 21 0 10 4 10 4v8a28 28 0 0 1-52 0z' fill='%23fff'/%3E%3C/svg%3E" />
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js" async></script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- Loading screen (only screen shown before gameplay) -->
    <div id="loading">
      <div class="load-inner">
        <div class="logo">
          <div class="logo-sun"></div>
          <div class="logo-title">SPLASH HAVEN</div>
          <div class="logo-sub">WATERPARK TYCOON</div>
        </div>
        <div class="load-bar"><div id="load-fill"></div></div>
        <div id="load-text">Filling the pools…</div>
      </div>
    </div>

    <div id="hud" class="hidden">
      <div id="hud-tl">
        <div class="stat money"><span class="ico coin"></span><span id="cash">$0</span><span id="cash-delta"></span></div>
        <div class="stat"><span class="ico guests"></span><span id="guest-count">0</span><span class="sub">guests</span></div>
        <div class="stat rating"><div id="stars"></div><span id="rating-num" class="sub">0.0</span></div>
      </div>
      <div id="hud-tc">
        <div id="clock-box"><span id="weather-ico"></span><span id="day-label">Day 1</span><span id="clock">09:00</span><span id="speed-label">1x</span></div>
        <div id="park-status"></div>
        <div id="alerts"></div>
      </div>
      <div id="hud-tr">
        <div id="level-box"><div id="level-badge">1</div><div class="lvl-right"><div class="lvl-label">LEVEL <span id="lvl-num">1</span></div><div class="xp-bar"><div id="xp-fill"></div></div><div id="xp-text">0 / 100 XP</div></div></div>
        <div id="quests"></div>
      </div>
      <div id="crosshair"><div class="dot"></div></div>
      <div id="prompt"></div>
      <div id="progress-ring" class="hidden"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" class="bg"/><circle cx="20" cy="20" r="16" class="fg" id="ring-fg"/></svg></div>
      <div id="infocard" class="hidden"></div>
      <div id="toasts"></div>
      <div id="build-panel" class="hidden"></div>
      <div id="hotbar"></div>
      <canvas id="minimap" width="200" height="200"></canvas>
      <div id="floaters"></div>
      <div id="compass-arrows"></div>
    </div>

    <div id="intro-hint" class="hidden"><div class="ih-box"><div class="ih-title">Click to play</div><div class="ih-sub">WASD move · Mouse look · E interact · B build · Tab manage</div></div></div>

    <div id="overlay-root"></div>
    <div id="levelup" class="hidden"></div>
    <div id="touch-ui" class="hidden">
      <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
      <div id="touch-btns">
        <button data-t="use" class="tb big">USE</button>
        <button data-t="interact" class="tb">E</button>
        <button data-t="jump" class="tb">JUMP</button>
        <button data-t="build" class="tb">BUILD</button>
        <button data-t="tablet" class="tb">PARK</button>
        <button data-t="tool" class="tb">TOOL</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
